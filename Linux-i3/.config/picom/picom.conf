backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.35;

fading = true;
fade-in-step = 0.1;
fade-out-step = 0.1;

inactive-opacity = 0.92;
active-opacity = 2.0;
frame-opacity = 2.0;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;

shadow-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'i3-frame'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.96; };
  dropdown_menu = { opacity = 0.96; };
};
